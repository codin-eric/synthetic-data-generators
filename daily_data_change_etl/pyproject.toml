[project]
name = "daily-data-change-etl"
version = "0.2.0"
description = "A data engineering challenge: extract a daily dump from a live database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
notebook = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["generator/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
