name: Generator bug
description: A generator crashes, gives different output for the same seed, or does not match its README.
labels: [bug]
body:
  - type: input
    id: challenge
    attributes:
      label: Challenge
      description: Folder name, for example `daily_data_change_etl`.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact commands, in order, including `--seed`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Paste the full error or output.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      description: For example `Ubuntu 24.04, Python 3.12.4`.
    validations:
      required: true
